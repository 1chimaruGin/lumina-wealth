name: Weekly digest

on:
  schedule:
    # Same correction as the daily workflow: GitHub fires this repo's scheduled
    # runs about five hours late, so the slot is booked early. Targeting ~11:30
    # JST Sunday means asking at 21:10 UTC Saturday. The digest is idempotent,
    # so the retry simply rewrites the same file.
    - cron: "10 21 * * 6"   # target ~11:30 JST Sunday
    - cron: "0 4 * * 0"     # retry
  workflow_dispatch:
    inputs:
      date:
        description: "Any date in the target week (YYYY-MM-DD). Blank = this week."
        required: false

permissions:
  contents: write

concurrency:
  group: lumina-commit
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the digest
        run: python scripts/weekly.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests
          if git diff --staged --quiet; then
            echo "Nothing changed — not committing."
            exit 0
          fi
          git commit -m "Weekly digest $(TZ=Asia/Tokyo date +%G-W%V)"
          # Generation takes minutes, so main can move underneath this run. The
          # first version of this rebased and retried — but a rebase that hits a
          # CONFLICT stops with unmerged files, and every later attempt then died
          # on "Pulling is not possible because you have unmerged files". Three
          # attempts, one real failure, brief discarded.
          #
          # So: always leave a clean state before retrying, and resolve conflicts
          # deterministically. Everything this job writes is a generated artifact
          # belonging to THIS run, so on a conflict our side wins.
          for attempt in 1 2 3; do
            git fetch origin main || true
            if git rebase origin/main; then
              git push && { echo "Pushed on attempt $attempt."; exit 0; }
            else
              echo "Rebase conflicted on attempt $attempt; taking this run's generated files."
              git checkout --theirs -- . 2>/dev/null || true
              git add -A
              if GIT_EDITOR=true git rebase --continue; then
                git push && { echo "Pushed on attempt $attempt after resolving."; exit 0; }
              fi
            fi
            # Never start an attempt from a half-finished rebase.
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Could not push after 3 attempts. The generated files are in this run's workspace only."
          exit 1
