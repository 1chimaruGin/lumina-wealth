name: Weekly digest

on:
  schedule:
    # Same correction as the daily workflow: GitHub fires this repo's scheduled
    # runs about five hours late, so the slot is booked early. Targeting ~11:30
    # JST Sunday means asking at 21:10 UTC Saturday. The digest is idempotent,
    # so the retry simply rewrites the same file.
    - cron: "10 21 * * 6"   # target ~11:30 JST Sunday
    - cron: "0 4 * * 0"     # retry
  workflow_dispatch:
    inputs:
      date:
        description: "Any date in the target week (YYYY-MM-DD). Blank = this week."
        required: false

permissions:
  contents: write

concurrency:
  group: lumina-commit
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the digest
        run: python scripts/weekly.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests
          if git diff --staged --quiet; then
            echo "Nothing changed — not committing."
            exit 0
          fi
          git commit -m "Weekly digest $(TZ=Asia/Tokyo date +%G-W%V)"
          # Generation takes minutes, so main may have moved underneath this run —
          # a human push mid-run made the first attempt fail non-fast-forward and
          # threw the brief away. Rebase onto whatever landed, then retry.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 5
          done
          echo "::error::Could not push after 3 attempts. The generated files are in this run's workspace only."
          exit 1
