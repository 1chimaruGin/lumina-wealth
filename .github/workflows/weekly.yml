name: Weekly digest

on:
  schedule:
    # 02:30 UTC Sunday == 11:30 JST Sunday, half an hour after the daily brief
    # so the digest can include that morning's entry.
    - cron: "30 2 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "Any date in the target week (YYYY-MM-DD). Blank = this week."
        required: false

permissions:
  contents: write

concurrency:
  group: lumina-commit
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the digest
        run: python scripts/weekly.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests
          if git diff --staged --quiet; then
            echo "Nothing changed — not committing."
            exit 0
          fi
          git commit -m "Weekly digest $(TZ=Asia/Tokyo date +%G-W%V)"
          git push
