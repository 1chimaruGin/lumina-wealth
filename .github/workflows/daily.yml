name: Daily brief

on:
  schedule:
    # GitHub runs `schedule` on a best-effort basis: runs are delayed during
    # high load and are sometimes dropped entirely. Observed here: 2026-09-24
    # fired 5h19m late, 2026-09-25 never fired at all.
    #
    # Two mitigations. First, avoid the top of the hour, which is the most
    # contended slot. Second, try again later in the day — the job below exits
    # early if today's brief already exists, so the extra slots cost nothing
    # on a normal day and rescue a missed one.
    - cron: "17 2 * * *"    # 11:17 JST — the intended slot
    - cron: "17 5 * * *"    # 14:17 JST — first retry
    - cron: "17 9 * * *"    # 18:17 JST — last chance
  workflow_dispatch:
    inputs:
      date:
        description: "Build a specific date (YYYY-MM-DD, JST). Blank = today."
        required: false
      no_llm:
        description: "Skip the API and use the offline scorer"
        type: boolean
        default: false

permissions:
  contents: write

# One writer at a time: the daily, weekly and backfill jobs all commit to main.
concurrency:
  group: lumina-commit
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code
        # The scorer runs through the CLI, which authenticates against the
        # Claude subscription — no ANTHROPIC_API_KEY anywhere.
        run: npm install -g @anthropic-ai/claude-code

      - name: Has today's brief already been written?
        id: guard
        # The retry slots must not rewrite a brief that already exists — that
        # would burn model calls and churn the file for nothing.
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          REQUESTED="${{ inputs.date }}"
          TARGET="${REQUESTED:-$TODAY}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ -f "daily/$TARGET.md" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "daily/$TARGET.md already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Claude Code auth
        if: steps.guard.outputs.skip != 'true'
        # Without this the run would quietly fall back to the offline scorer
        # and produce a worse brief every day with nothing obviously broken.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Create one with 'claude setup-token' and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          claude --version

      - name: Build the brief
        if: steps.guard.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/compose.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.no_llm && '--no-llm' || '' }}

      - name: Build the dashboard
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/site.py

      - name: Upload the dashboard
        # GitHub Pages needs a paid plan on a private repo. This keeps the
        # dashboard one download away regardless.
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/index.html
          retention-days: 30

      - name: Notify
        # Only fires when config/settings.yaml sets notify.channel to slack or email.
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/notify.py

      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily ideas data
          if git diff --staged --quiet; then
            echo "Nothing changed — not committing."
            exit 0
          fi
          git commit -m "Daily brief $(TZ=Asia/Tokyo date +%F)"
          git push
