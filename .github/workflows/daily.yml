name: Daily brief

on:
  schedule:
    # These times look wrong. They are not.
    #
    # GitHub runs `schedule` on a best-effort basis and this repo has been
    # measured at roughly five hours late, every single day:
    #
    #   slot 02:17 UTC -> fired 08:08 (5h51m late)
    #   slot 05:17 UTC -> fired 10:35 (5h18m late)
    #   slot 09:17 UTC -> fired 14:42 (5h25m late)
    #   the day before: 5h22m, 4h38m, 4h28m
    #
    # Asking for 02:00 UTC therefore delivers the brief at about 17:00 JST, not
    # 11:00. So the primary slot is booked ~5h20m EARLY, at 20:40 UTC, which
    # lands the run near 11:00 JST the following day. Observed delays range
    # 4h28m-5h51m, putting arrival somewhere in 10:10-11:30 JST.
    #
    # Note 20:40 UTC is already past midnight in Tokyo, so the brief is dated
    # correctly for the JST day either way — the guard step derives the date
    # with TZ=Asia/Tokyo, not from the cron.
    #
    # The later slots exist for the case where a run is dropped entirely rather
    # than delayed. They cost nothing: the job exits early when today's brief
    # already exists.
    - cron: "40 20 * * *"   # target 11:00 JST, booked early to absorb the delay
    - cron: "0 1 * * *"     # retry
    - cron: "0 5 * * *"     # retry
    - cron: "0 9 * * *"     # last chance
  workflow_dispatch:
    inputs:
      date:
        description: "Build a specific date (YYYY-MM-DD, JST). Blank = today."
        required: false
      no_llm:
        description: "Skip the API and use the offline scorer"
        type: boolean
        default: false

permissions:
  contents: write

# One writer at a time: the daily, weekly and backfill jobs all commit to main.
concurrency:
  group: lumina-commit
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code
        # The scorer runs through the CLI, which authenticates against the
        # Claude subscription — no ANTHROPIC_API_KEY anywhere.
        run: npm install -g @anthropic-ai/claude-code

      - name: Has today's brief already been written?
        id: guard
        # The retry slots must not rewrite a brief that already exists — that
        # would burn model calls and churn the file for nothing.
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          REQUESTED="${{ inputs.date }}"
          TARGET="${REQUESTED:-$TODAY}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ -f "daily/$TARGET.md" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "daily/$TARGET.md already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Claude Code auth
        if: steps.guard.outputs.skip != 'true'
        # Without this the run would quietly fall back to the offline scorer
        # and produce a worse brief every day with nothing obviously broken.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Create one with 'claude setup-token' and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          claude --version

      - name: Build the brief
        if: steps.guard.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/compose.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.no_llm && '--no-llm' || '' }}

      - name: Build the dashboard
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/site.py

      - name: Upload the dashboard
        # GitHub Pages needs a paid plan on a private repo. This keeps the
        # dashboard one download away regardless.
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/index.html
          retention-days: 30

      - name: Notify
        # Only fires when config/settings.yaml sets notify.channel to slack or email.
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/notify.py

      - name: Commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily ideas data
          if git diff --staged --quiet; then
            echo "Nothing changed — not committing."
            exit 0
          fi
          git commit -m "Daily brief $(TZ=Asia/Tokyo date +%F)"
          # Generation takes minutes, so main may have moved underneath this run —
          # a human push mid-run made the first attempt fail non-fast-forward and
          # threw the brief away. Rebase onto whatever landed, then retry.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 5
          done
          echo "::error::Could not push after 3 attempts. The generated files are in this run's workspace only."
          exit 1
