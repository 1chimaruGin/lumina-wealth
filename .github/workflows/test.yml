name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        # No network: every test runs against fixtures and fakes.
        run: python -m pytest tests/ -q

      - name: The pipeline still builds a brief offline
        env:
          LUMINA_BACKEND: offline
        run: python scripts/compose.py --dry-run --no-llm > /dev/null
