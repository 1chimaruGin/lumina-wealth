name: Dashboard

# Publishes site/index.html to GitHub Pages whenever the content changes.
on:
  push:
    branches: [main]
    paths:
      - "daily/**"
      - "digests/**"
      - "ideas/**"
      - "streams/**"
      - "templates/site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the dashboard
        # Rebuilt here rather than trusting the committed copy, so the page
        # always matches the repo it was deployed from.
        run: python scripts/site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
