name: Dashboard

# Publishes site/index.html to GitHub Pages.
#
# Pages is unavailable on a private repo on the free plan, so this workflow is
# OFF until you say otherwise. It does not run — and therefore cannot fail —
# unless the repository variable PAGES_ENABLED is set to "true".
#
# To turn it on, once Pages is actually available to you:
#   1. Settings -> Pages -> Source: GitHub Actions
#   2. gh variable set PAGES_ENABLED --body true --repo <owner>/<repo>
#
# Until then the Daily workflow uploads the dashboard as a downloadable
# "dashboard" artifact, and `python scripts/site.py --open` builds it locally.

on:
  # No path filter. The page is rendered from the templates, the config, the
  # lumina package AND the content, so almost any change can alter it — a
  # narrow filter has now twice left the site stale after a real change. The
  # build takes about a minute; over-triggering is much cheaper than the
  # alternative.
  push:
    branches: [main]

  # A push made with GITHUB_TOKEN does NOT trigger other workflows — GitHub
  # blocks that to prevent recursion. So the bot's daily commit never fired the
  # push trigger above, and the dashboard sat frozen on the date of the last
  # HUMAN push while the repo moved on without it.
  #
  # workflow_run is the documented way out: rebuild after the jobs that write
  # content finish, whoever pushed.
  workflow_run:
    workflows: ["Daily brief", "Weekly digest", "Backfill"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # The whole job is skipped unless Pages has been turned on deliberately.
    # A skipped job is not a failed one, which is the point: an impossible
    # deploy should not look like a broken build on every push.
    # Skip a rebuild when the workflow that triggered this one failed; a push
    # or a manual run always rebuilds.
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a workflow_run event the default ref is the commit that started
          # the triggering run, which is one commit BEHIND the content that run
          # just committed. Take the branch tip instead.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the dashboard
        # Rebuilt here rather than trusting a committed copy, so the page
        # always matches the repo it was deployed from.
        run: python scripts/site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
