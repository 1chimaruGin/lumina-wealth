name: Backfill

# Manual only. Backfill costs API tokens and rewrites history, so it never
# runs on a schedule.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to build"
        required: true
        default: "7"
      end:
        description: "Last day to build (YYYY-MM-DD, JST). Blank = today."
        required: false
      overwrite:
        description: "Rebuild days that already have a brief"
        type: boolean
        default: false
      no_llm:
        description: "Skip the API and use the offline scorer"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lumina-commit
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code
        # The scorer runs through the CLI, which authenticates against the
        # Claude subscription — no ANTHROPIC_API_KEY anywhere.
        run: npm install -g @anthropic-ai/claude-code

      - name: Check Claude Code auth
        # Without this the run would quietly fall back to the offline scorer
        # and produce a worse brief every day with nothing obviously broken.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Create one with 'claude setup-token' and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          claude --version

      - name: Backfill
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python scripts/backfill.py \
            --days ${{ inputs.days }} \
            --weekly \
            ${{ inputs.end && format('--end {0}', inputs.end) || '' }} \
            ${{ inputs.overwrite && '--overwrite' || '' }} \
            ${{ inputs.no_llm && '--no-llm' || '' }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily digests ideas data
          if git diff --staged --quiet; then
            echo "Nothing changed — not committing."
            exit 0
          fi
          git commit -m "Backfill ${{ inputs.days }} day(s)"
          # Generation takes minutes, so main can move underneath this run. The
          # first version of this rebased and retried — but a rebase that hits a
          # CONFLICT stops with unmerged files, and every later attempt then died
          # on "Pulling is not possible because you have unmerged files". Three
          # attempts, one real failure, brief discarded.
          #
          # So: always leave a clean state before retrying, and resolve conflicts
          # deterministically. Everything this job writes is a generated artifact
          # belonging to THIS run, so on a conflict our side wins.
          for attempt in 1 2 3; do
            git fetch origin main || true
            if git rebase origin/main; then
              git push && { echo "Pushed on attempt $attempt."; exit 0; }
            else
              echo "Rebase conflicted on attempt $attempt; taking this run's generated files."
              git checkout --theirs -- . 2>/dev/null || true
              git add -A
              if GIT_EDITOR=true git rebase --continue; then
                git push && { echo "Pushed on attempt $attempt after resolving."; exit 0; }
              fi
            fi
            # Never start an attempt from a half-finished rebase.
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Could not push after 3 attempts. The generated files are in this run's workspace only."
          exit 1
