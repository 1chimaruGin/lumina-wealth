name: Backfill

# Manual only. Backfill costs API tokens and rewrites history, so it never
# runs on a schedule.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to build"
        required: true
        default: "7"
      end:
        description: "Last day to build (YYYY-MM-DD, JST). Blank = today."
        required: false
      overwrite:
        description: "Rebuild days that already have a brief"
        type: boolean
        default: false
      no_llm:
        description: "Skip the API and use the offline scorer"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lumina-commit
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code
        # The scorer runs through the CLI, which authenticates against the
        # Claude subscription — no ANTHROPIC_API_KEY anywhere.
        run: npm install -g @anthropic-ai/claude-code

      - name: Check Claude Code auth
        # Without this the run would quietly fall back to the offline scorer
        # and produce a worse brief every day with nothing obviously broken.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Create one with 'claude setup-token' and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          claude --version

      - name: Backfill
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python scripts/backfill.py \
            --days ${{ inputs.days }} \
            --weekly \
            ${{ inputs.end && format('--end {0}', inputs.end) || '' }} \
            ${{ inputs.overwrite && '--overwrite' || '' }} \
            ${{ inputs.no_llm && '--no-llm' || '' }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily digests ideas data
          if git diff --staged --quiet; then
            echo "Nothing changed — not committing."
            exit 0
          fi
          git commit -m "Backfill ${{ inputs.days }} day(s)"
          # Generation takes minutes, so main may have moved underneath this run —
          # a human push mid-run made the first attempt fail non-fast-forward and
          # threw the brief away. Rebase onto whatever landed, then retry.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 5
          done
          echo "::error::Could not push after 3 attempts. The generated files are in this run's workspace only."
          exit 1
