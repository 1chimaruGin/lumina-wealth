# Lumina Daily — runtime settings.
# Secrets NEVER live here. They come from the environment / GitHub repo secrets.

timezone: Asia/Tokyo

schedule:
  # Informational mirror of .github/workflows/*.yml cron values.
  # Daily brief   : 11:00 JST  == cron "0 2 * * *"  (UTC)
  # Weekly digest : 11:30 JST Sunday == cron "30 2 * * 0" (UTC)
  daily_local_time: "11:00"
  weekly_local_time: "11:30"
  weekly_day: sunday

model:
  # Which backend does the scoring:
  #   claude-code  the Claude Code CLI. No API key — it runs on your Claude
  #                subscription. Locally that means you have signed in with
  #                `claude`; in CI it means a CLAUDE_CODE_OAUTH_TOKEN secret
  #                made with `claude setup-token`.
  #   api          the Anthropic API, needs ANTHROPIC_API_KEY.
  #   offline      deterministic heuristic scorer, no network at all.
  #   auto         claude-code if the CLI is present, else api, else offline.
  # An unavailable backend degrades to the next one; it never fails the run,
  # and the brief always names the scorer that actually produced it.
  backend: claude-code

  # Model for the API backend.
  scorer: claude-haiku-4-5
  # Model alias for the CLI backend (haiku | sonnet | opus).
  cli_model: haiku
  # A batch of 8 takes ~80s; this is the per-call ceiling, not a target.
  cli_timeout_seconds: 420

  max_output_tokens: 2000
  temperature: 0.2
  # How many items are packed into a single scoring request. Bigger batches
  # mean fewer calls, which is what the subscription rate limit actually counts.
  batch_size: 8

budget:
  # Hard stop. When a run crosses a ceiling it stops calling the model,
  # composes the brief from whatever was already scored, and says so in the
  # "Run notes" section. A run is never failed because of budget.
  #
  # On the claude-code backend nothing is billed per call, so the dollar
  # ceilings are ignored and the call ceiling is the one that matters — calls
  # are what a subscription rate limit actually counts.
  max_calls_per_run: 12
  max_calls_per_backfill: 90
  max_input_tokens_per_run: 400000
  # Lessons are output-heavy: ~2-3k tokens each, and the CLI counts thinking
  # tokens too. Sized for scoring alone, this tripped mid-backfill.
  max_output_tokens_per_run: 90000
  max_usd_per_run: 0.25
  # Backfill runs many days at once; this caps the whole backfill job.
  max_usd_per_backfill: 2.00
  # Per-1M-token prices used only for the local cost estimate in data/usage.json.
  price_per_mtok_input: 1.00
  price_per_mtok_output: 5.00

collect:
  # Per-source HTTP settings.
  timeout_seconds: 20
  retries: 2
  retry_backoff_seconds: 3
  user_agent: "lumina-wealth/1.0 (personal daily brief; +https://github.com/1chimaruGin/lumina-wealth)"
  # Items older than this are dropped on a normal daily run.
  lookback_days: 3
  # Ceiling on raw items pulled from any one source in a run.
  max_items_per_source: 40

select:
  # Spec: cap 8 items per section per run, 1 mind item, 2-3 stream items.
  max_candidates_per_section: 8
  mind_picks: 1
  # Opportunities are still collected, scored and filed to the inbox every day —
  # capture stays free. They are just not SHOWN daily: seeing candidates you are
  # not allowed to start is the exact pressure the one-at-a-time rule exists to
  # remove. They surface in the Sunday digest instead.
  show_streams_in_daily: false
  # Extra reading shown as one-line links under the summarised piece — cheap,
  # skippable, and no extra model calls.
  mind_extra_links: 3
  stream_picks: 3
  # A stream item below this weighted score is never shown, even if it is the
  # best available. Better an honest short brief than filler.
  min_stream_score: 4.5

curriculum:
  # Lessons are the spine of the Mind section. Feeds are recency-driven and run
  # dry — four of the five original Mind sources published weekly or monthly —
  # whereas a syllabus teaches in sequence and can start in 3000 BC.
  lessons_per_day: 2
  # One lesson comes from the weekday's track (see meta.rotation in the
  # syllabus); the rest come from whichever track is furthest behind, so
  # coverage stays even on its own.
  syllabus: curriculum/syllabus.yaml
  # Written lessons are cached here, which makes rebuilding an old brief free
  # and deterministic. They accumulate into a personal textbook.
  lessons_dir: curriculum/lessons

principles:
  # Spaced repetition: never resurface a principle seen within this window
  # unless every principle has been seen inside it.
  cooldown_days: 21

notify:
  # one of: none | slack | email
  channel: none
  slack:
    # Webhook itself comes from the SLACK_WEBHOOK_URL secret.
    username: "Lumina Daily"
    icon_emoji: ":sunrise:"
  email:
    # SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD come from secrets.
    to: ""
    from: ""
    subject_prefix: "[Lumina]"

stream:
  # The anti-scatter gate. Both routes are defined here so the rule is data,
  # not buried logic.
  cycle_days: 90
  gate:
    # Route A: first revenue AND a routine that actually held.
    min_revenue_jpy: 1
    min_logged_days: 14
    routine_window_days: 21
    min_actions_in_window: 10
    # Route B: 90 days done AND a written decision filed in streams/archive/.
    require_written_decision: true

site:
  title: "Lumina Daily"
  tagline: "Learning money from 3000 BC · building one stream at a time"
  # Number of briefs listed on the dashboard.
  recent_briefs: 30
