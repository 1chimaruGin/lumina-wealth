# The reading list.
#
# One book surfaces per day. The generated note is not a review and not a sales
# pitch — it states the argument, the one idea worth keeping, and whether the
# book is actually worth your hours or whether the summary is enough. Most money
# books are one insight and two hundred pages of padding; saying so is the point.
#
# `weight` nudges ordering. `track` ties a book to a syllabus track.
# Add your own freely; `id` must stay unique.

